name: Verify Solus
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: python -m pip install -e ".[test]"
      - run: npm ci && npm run build && npm test
        working-directory: ui
      - run: python -m pytest -p no:cacheprovider
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - name: Browser acceptance against disposable data
        run: |
          python tests/browser_server.py > "$RUNNER_TEMP/solus-browser.log" 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8767/health > /dev/null; then break; fi
            sleep 1
          done
          node ui/tests/browser.mjs
      - name: Build distributable wheel
        run: python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/solus-wheels" .
