[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "solus-accounting"
version = "0.1.0"
description = "The deterministic accounting module of SPEDA Mark VI, with a standalone UI and AI command contracts"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{name = "Ahmet Erol Bayrak"}]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy[asyncio]>=2.0,<3", "aiosqlite>=0.20,<1", "pydantic>=2.10,<3", "tzdata>=2025.1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1"]

[project.scripts]
solus = "solus.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
solus = ["static/solus/*", "static/solus/assets/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
